[General]
include=VolumioBase.conf
# only pick what we need from VolumioBase
debootstrap=Base Net Utils Assets FS Firmware Accessories Volumio BasePlus Kiosk UpmpdcliDependencies ShairportSyncDependencies
# Keep a single APT source list to avoid duplicate target warnings from multistrap
aptsources=Base

# Add additional x86 specific packages (if required)

[BasePlus]
packages=gdisk grub-common initramfs-tools pciutils plymouth plymouth-label syslinux syslinux-common acpid dmidecode inxi lshw
source=http://archive.debian.org/debian
keyring=debian-archive-keyring
suite=buster